<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الصفحة الرئيسية</title>
  <style>
    :root{--c1:#7c3aed;--c2:#06b6d4;--c3:#f59e0b}
    body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:'Cairo',sans-serif;color:#fff;background:#0b1021}
    .gradient-bg{position:fixed;inset:0;background:linear-gradient(120deg,var(--c1),var(--c2),var(--c3));
      background-size:180% 180%;animation:shift 12s ease-in-out infinite;z-index:-1}
    @keyframes shift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    .banner{background:rgba(255,255,255,.14);padding:20px 30px;border-radius:18px;text-align:center}
    h1{margin:0 0 10px;font-size:28px;font-weight:900}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="gradient-bg"></div>
  <div class="banner">
    <h1>الباش مهندس فوزي قال اعملوا الـ Login والـ Register بس</h1>
    
  </div>
</body>
</html>
