<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gosor — Create Account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./imga/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="card-shell">
      <div class="row g-0">
        <div class="col-lg-5 bg-white">
          <div class="form-panel">
            <div class="brand mb-4">
              <div class="logo">G</div>
              <div style="color:#111;">GOSOR</div>
            </div>

            <h1>Create Account</h1>
            <p class="lead">Create a new account for free</p>

            <form class="form" novalidate>
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input id="name" type="text" class="form-control "
                       placeholder="Ahmed Mohamed" required name="name"
                       autocomplete="name">
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" class="form-control "
                       placeholder="example@email.com" required name="email"
                       autocomplete="email">
              </div>

              <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input id="password" type="password" class="form-control"
                       placeholder="Password" required name="password"
                       minlength="8" autocomplete="new-password">
              </div>

              <div class="mb-4">
                <label for="passwordConfirmation" class="form-label">Confirm password</label>
                <input id="passwordConfirmation" type="password" class="form-control"
                       placeholder="Confirm password" required name="password_confirmation"
                       minlength="8" autocomplete="new-password">
              </div>

              <button type="submit" class="btn btn-gosor w-100">Register</button>

              <p class="text-center mt-3 mb-0" style="color:#6b7280;">
                Already have an account?
                <a href="../gosor_login/index.html" class="link-success text-decoration-none">Login</a>
              </p>
            </form>
          </div>
        </div>

        <div class="col-lg-7 art-panel">
          <div class="art-surface">
         
            <img class="art-illustration" alt="Checklist Illustration" src="./imga/Rectangle%201.png" />
          </div>
        </div>
      </div>
    </div>
  </div>
   

   <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./script/script.js" ></script>
</body>
</html>
