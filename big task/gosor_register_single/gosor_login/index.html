<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gosor — Login</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS File -->
  <link rel="stylesheet" href="./style/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="card-shell">
      <div class="row g-0">
        <!-- Left: Login form -->
        <div class="col-lg-5 bg-white">
          <div class="form-panel">
            <!-- Logo -->
            <div class="brand mb-4">
              <div class="logo">G</div>
              <div style="color:#111;">GOSOR</div>
            </div>

            <h1>Login</h1>
            <p class="lead">Login to your account</p>

            <form novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" class="form-control" placeholder="example@email.com" required>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input id="password" type="password" class="form-control" placeholder="password" required>
              </div>

              <button type="submit" class="btn btn-gosor w-100">Login</button>

              <p class="text-center mt-3 mb-0" style="color:#6b7280;">
                Don’t have an account?
                <a href="#" class="link-success text-decoration-none">Create account</a>
              </p>
            </form>
          </div>
        </div>

        <!-- Right: Illustration -->
        <div class="col-lg-7 art-panel">
          <div class="art-surface">
            <img
              class="art-illustration"
              alt="Checklist Illustration"
              src="./style/Rectangle 1.png"
            />
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
