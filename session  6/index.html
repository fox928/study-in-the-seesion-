<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=4, initial-scale=1.0">
    <title>To Do List App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>

    <div class="container">
        <div class="d-flex flex-column justify-content-center align-items-center gap-3">
            <p class="fw-bold display-3">To Do List App</p>
            <div class="d-felx">
                <button onclick="showTasks()" class="btn btn-primary">Show Tasks</button>
                <button onclick="addTask()" class="btn btn-success">Add Task</button>
                <button onclick="changeStatus1()" class="btn btn-info">Change Status 1</button>
                <button onclick="changeStatus2()" class="btn btn-info">Change Status 2</button>
                <button onclick="updateTask()" class="btn btn-warning">Update Task</button>
                <button onclick="removeTask()" class="btn btn-danger">Delete Task</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="./js/script.js"></script>
    
</body>
</html>
