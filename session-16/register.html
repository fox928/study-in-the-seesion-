<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Register</title>
</head>

<body>
    <div class="container my-5">
        <div class="row justify-content-center ">
            <div class="col-lg-8">
                <form class="border p-3 rounded d-flex flex-column gap-3">
                    <h2 class="py-2 text-primary">Sign Up</h2>
                    <input type="text" name="name" placeholder="Name" class="form-control" id="name">
                    <input type="email" name="email" placeholder="Email" class="form-control" id="email">
                    <input type="password" name="password" placeholder="Password" class="form-control" id="password">
                    <input type="password" name="password_confirmation" placeholder="Confirm Password"
                        class="form-control" id="passwordConfirmation">
                    <button class="btn btn-primary">Sing Up</button>
                    <p>do you have an account <a href="login.html">Login</a></p>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <script src="./js/register.js"></script>
</body>

</html>
